<!DOCTYPE html>
<html>
<head>
  <title>Sarosh's Hockey Shootout</title>
  <style>
    /* This part (CSS) decides how the web page LOOKS */
    body { background: #0b1118; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
    canvas { border-radius: 12px; box-shadow: 0 10px 40px black; max-width: 100%; cursor: pointer; }
  </style>
</head>
<body>

  <!-- The canvas is like a blank whiteboard that our code draws on -->
  <canvas id="rink" width="900" height="600"></canvas>

  <script>
    // =====================================================================
    //  SAROSH'S HOCKEY SHOOTOUT
    //  HOW TO PLAY:
    //   1. Pick your move: Wrist Shot or Deke
    //   2. Wait for the whistle!
    //   3. Skate with the ARROW KEYS (up = faster, down = slower)
    //   4. CLICK inside the net where you want to shoot
    // =====================================================================

    // ----- 1. SETTINGS: numbers you can change! -----
    const CAMERA = {
      x: 0,           // left/right (the camera follows the shooter)
      z: 0,           // how far down the rink (the camera follows the shooter)
      height: 13,     // how high the camera is, in feet
      zoom: 850,      // how zoomed in the camera is
      horizon: 60,    // where the far end of the rink sits on the screen
      behind: 24,     // how many feet the camera stays BEHIND the shooter
      side: 6         // how many feet the camera stays to the RIGHT of the shooter
    };

    // Real NHL rink sizes, in feet
    const RINK = {
      halfWidth: 42.5, endBoards: 100, cornerRadius: 28,
      goalLine: 89, blueLine: 25, boardHeight: 3.5, glassHeight: 8
    };

    // The net is 6 feet wide and 4 feet tall
    const NET = { halfWidth: 3, height: 4, depth: 3.3 };

    const COLORS = {
      ice: "#eef6fb", red: "#c8102e", blue: "#0b3fa8", crease: "#7cc4f2",
      boards: "#f7f7f2", kickplate: "#f2c230"
    };

    // Jersey colors
    const SHOOTER_TEAM = { jersey: "#00539b", stripe: "#f47d30", pants: "#0a2240", number: "11" }; // blue + orange
    const GOALIE_TEAM  = { jersey: "#0038a8", stripe: "#ce1126", pads: "#f4f4f4" };                 // blue + red + white

    // The two moves
    const MOVES = {
      wrist: { name: "Wrist Shot", puckSpeed: 80 }, // feet per second
      deke:  { name: "Deke",       puckSpeed: 50 }  // slower shot, but it fakes out the goalie!
    };

    const SKATE = { startSpeed: 16, minSpeed: 8, maxSpeed: 24, sideSpeed: 10 };
    const GOALIE_SETTINGS = { z: 86.8, speed: 7, reactionTime: 0.15 };

    // ----- 2. GET THE WHITEBOARD AND A MARKER -----
    const canvas = document.getElementById("rink");
    const pen = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;

    // ----- 3. GAME STATE: everything the game needs to remember -----
    // "state" is which part of the game we're in, like the period of a hockey game:
    //   "menu" -> "ready" -> "skating" -> ("deke") -> "shot" -> "result" -> back to "menu"
    let state = "menu";
    let chosenMove = "wrist";
    let timer = 0;          // counts seconds in the current state
    let clock = 0;          // counts seconds since the game started
    let goals = 0;
    let shots = 0;
    let resultText = "";
    let message = "";       // a little hint at the bottom of the screen
    let messageTimer = 0;

    const shooter = { x: 0, z: 22, speed: SKATE.startSpeed, sideways: 0 };
    const goalie = { x: 0, speed: 0 };
    const puck = { x: 0, y: 0, z: 0, onStick: true };
    let shot = null;        // info about the shot while the puck is flying
    let deke = null;        // info about the deke while it's happening

    // Which keys are being held down right now
    const keys = {};
    document.addEventListener("keydown", e => { keys[e.key] = true; if (e.key.startsWith("Arrow")) e.preventDefault(); });
    document.addEventListener("keyup", e => { keys[e.key] = false; });

    // ----- 4. THE 3D MAGIC: turn a real spot (feet) into a screen spot (pixels) -----
    // x = left/right, y = up/down (height), z = how far away
    function toScreen(x, y, z) {
      const distance = z - CAMERA.z;          // how far the spot is from the camera
      const scale = CAMERA.zoom / distance;   // far away = small, close = big
      return {
        x: W / 2 + (x - CAMERA.x) * scale,
        y: CAMERA.horizon + (CAMERA.height - y) * scale,
        scale: scale
      };
    }

    // The opposite: you clicked a spot on the screen, where is that on the net?
    function screenToNet(sx, sy) {
      const scale = CAMERA.zoom / (RINK.goalLine - CAMERA.z);
      return {
        x: (sx - W / 2) / scale + CAMERA.x,
        y: CAMERA.height - (sy - CAMERA.horizon) / scale
      };
    }

    // How wide is the rink at a certain distance? (it gets narrower in the round corners)
    function rinkHalfWidthAt(z) {
      const cornerStart = RINK.endBoards - RINK.cornerRadius;
      if (z <= cornerStart) return RINK.halfWidth;
      const into = Math.min(z - cornerStart, RINK.cornerRadius);
      return RINK.halfWidth - RINK.cornerRadius + Math.sqrt(RINK.cornerRadius ** 2 - into ** 2);
    }

    function rinkOutline() {
      const points = [];
      const nearZ = CAMERA.z + 4;
      for (let z = nearZ; z <= RINK.endBoards; z += 1) points.push({ x: -rinkHalfWidthAt(z), z: z });
      for (let z = RINK.endBoards; z >= nearZ; z -= 1) points.push({ x: rinkHalfWidthAt(z), z: z });
      return points;
    }

    function tracePath(points, height) {
      pen.beginPath();
      points.forEach((p, i) => {
        const s = toScreen(p.x, height, p.z);
        if (i === 0) pen.moveTo(s.x, s.y); else pen.lineTo(s.x, s.y);
      });
      pen.closePath();
    }

    function iceShape(points, color) {
      pen.fillStyle = color;
      tracePath(points, 0);
      pen.fill();
    }

    function iceLine(z, thickness, color) {
      if (z < CAMERA.z + 4) return; // behind the camera, skip it
      const w = rinkHalfWidthAt(z + thickness);
      iceShape([{ x: -w, z: z }, { x: w, z: z }, { x: w, z: z + thickness }, { x: -w, z: z + thickness }], color);
    }

    function iceRing(cx, cz, radius, thickness, color) {
      const points = [];
      for (let a = 0; a <= 360; a += 5) points.push({ x: cx + Math.cos(a * Math.PI / 180) * radius, z: cz + Math.sin(a * Math.PI / 180) * radius });
      for (let a = 360; a >= 0; a -= 5) points.push({ x: cx + Math.cos(a * Math.PI / 180) * (radius - thickness), z: cz + Math.sin(a * Math.PI / 180) * (radius - thickness) });
      if (points.some(p => p.z < CAMERA.z + 4)) return;
      iceShape(points, color);
    }

    // A random-number maker that gives the SAME "random" numbers every time
    let seed = 7;
    function random() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }

    // Make the skate scratches ONCE, so they stay in the same place on the ice
    const scratches = [];
    for (let i = 0; i < 320; i++) {
      let x = (random() - 0.5) * 80, z = 5 + random() * 92, direction = random() * Math.PI * 2;
      const line = [];
      for (let step = 0; step < 6; step++) {
        line.push({ x: x, z: z });
        direction += (random() - 0.5) * 0.4;
        x += Math.cos(direction) * 1.5;
        z += Math.sin(direction) * 1.5;
      }
      scratches.push(line);
    }

    // ----- 5. SOUNDS (made with code, no sound files needed!) -----
    let audio = null;
    function startAudio() { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); }

    function playWhistle() {
      if (!audio) return;
      const now = audio.currentTime;
      const tone = audio.createOscillator();
      const trill = audio.createOscillator();   // makes the whistle "rattle"
      const trillAmount = audio.createGain();
      const volume = audio.createGain();
      tone.frequency.value = 2900;
      trill.frequency.value = 35;
      trillAmount.gain.value = 250;
      trill.connect(trillAmount).connect(tone.frequency);
      volume.gain.setValueAtTime(0, now);
      volume.gain.linearRampToValueAtTime(0.15, now + 0.03);
      volume.gain.setValueAtTime(0.15, now + 0.55);
      volume.gain.linearRampToValueAtTime(0, now + 0.65);
      tone.connect(volume).connect(audio.destination);
      tone.start(now); trill.start(now); tone.stop(now + 0.7); trill.stop(now + 0.7);
    }

    function playHorn() {
      if (!audio) return;
      const now = audio.currentTime;
      const volume = audio.createGain();
      volume.gain.setValueAtTime(0, now);
      volume.gain.linearRampToValueAtTime(0.12, now + 0.05);
      volume.gain.setValueAtTime(0.12, now + 1.6);
      volume.gain.linearRampToValueAtTime(0, now + 1.9);
      volume.connect(audio.destination);
      [155, 196, 233].forEach(freq => {
        const o = audio.createOscillator();
        o.type = "sawtooth";
        o.frequency.value = freq;
        o.connect(volume);
        o.start(now); o.stop(now + 2);
      });
    }

    function playThud(high) {
      if (!audio) return;
      const now = audio.currentTime;
      const o = audio.createOscillator();
      const volume = audio.createGain();
      o.type = high ? "triangle" : "sine";
      o.frequency.setValueAtTime(high ? 1800 : 180, now);   // high = "PING!" off the post
      o.frequency.exponentialRampToValueAtTime(high ? 1500 : 60, now + 0.25);
      volume.gain.setValueAtTime(0.3, now);
      volume.gain.exponentialRampToValueAtTime(0.001, now + (high ? 0.6 : 0.25));
      o.connect(volume).connect(audio.destination);
      o.start(now); o.stop(now + 0.7);
    }

    // ----- 6. DRAW THE ARENA -----
    function drawCrowd() {
      seed = 99; // same crowd every frame, so the fans don't flicker
      const glassTop = toScreen(0, RINK.glassHeight, RINK.endBoards).y;
      const sky = pen.createLinearGradient(0, 0, 0, glassTop);
      sky.addColorStop(0, "#05080d");
      sky.addColorStop(1, "#1d2733");
      pen.fillStyle = sky;
      pen.fillRect(0, 0, W, H);

      const shirtColors = ["#c8102e", "#0b3fa8", "#ffffff", "#f47d30", "#00539b", "#333", "#888"];
      for (let y = 30; y < glassTop + 10; y += 11) {
        for (let x = 0; x < W; x += 9) {
          pen.fillStyle = shirtColors[Math.floor(random() * shirtColors.length)];
          pen.globalAlpha = Math.min(1, 0.3 + (y / glassTop) * 0.6);
          pen.fillRect(x + random() * 4, y + random() * 4, 5, 6);
        }
      }
      pen.globalAlpha = 1;

      for (let i = 0; i < 6; i++) {
        const glow = pen.createRadialGradient(90 + i * 144, 0, 0, 90 + i * 144, 0, 70);
        glow.addColorStop(0, "rgba(255,255,240,0.9)");
        glow.addColorStop(1, "rgba(255,255,240,0)");
        pen.fillStyle = glow;
        pen.fillRect(0, 0, W, 80);
      }
    }

    function drawWall(fromHeight, toHeight, color) {
      const outline = rinkOutline();
      pen.fillStyle = color;
      pen.beginPath();
      outline.forEach((p, i) => {
        const s = toScreen(p.x, toHeight, p.z);
        if (i === 0) pen.moveTo(s.x, s.y); else pen.lineTo(s.x, s.y);
      });
      for (let i = outline.length - 1; i >= 0; i--) {
        const s = toScreen(outline[i].x, fromHeight, outline[i].z);
        pen.lineTo(s.x, s.y);
      }
      pen.closePath();
      pen.fill();
    }

    function drawBoards() {
      drawWall(RINK.boardHeight, RINK.glassHeight, "rgba(200,225,240,0.18)"); // the glass
      drawWall(0, RINK.boardHeight, COLORS.boards);                         // white boards
      drawWall(0, 0.6, COLORS.kickplate);                                   // yellow kickplate
      drawWall(RINK.boardHeight - 0.15, RINK.boardHeight, "#2a2a2a");       // dark rail on top
    }

    function drawIce() {
      const top = toScreen(0, 0, RINK.endBoards).y;
      const iceColor = pen.createLinearGradient(0, top, 0, H);
      iceColor.addColorStop(0, "#d8e7f1");
      iceColor.addColorStop(1, COLORS.ice);
      iceShape(rinkOutline(), iceColor);

      pen.save();
      tracePath(rinkOutline(), 0);
      pen.clip(); // from now on, only paint INSIDE the ice

      // Painted lines (under the ice, so they look a bit faded)
      pen.globalAlpha = 0.85;
      iceLine(RINK.blueLine, 1, COLORS.blue);
      iceLine(RINK.goalLine, 0.5, COLORS.red);
      iceRing(-22, 69, 15, 0.4, COLORS.red);
      iceRing(22, 69, 15, 0.4, COLORS.red);
      iceRing(-22, 69, 1, 1, COLORS.red);
      iceRing(22, 69, 1, 1, COLORS.red);
      const crease = [];
      for (let a = 180; a <= 360; a += 5) crease.push({ x: Math.cos(a * Math.PI / 180) * 6, z: RINK.goalLine + Math.sin(a * Math.PI / 180) * 6 });
      iceShape(crease, COLORS.crease);
      pen.globalAlpha = 1;

      // Shiny reflections of the arena lights
      for (let i = 0; i < 5; i++) {
        const z = 55 + (i % 2) * 15;
        if (z < CAMERA.z + 8) continue;
        const spot = toScreen(-32 + i * 16, 0, z);
        pen.save();
        pen.translate(spot.x, spot.y);
        pen.scale(1, 2.2);
        const shine = pen.createRadialGradient(0, 0, 0, 0, 0, 45);
        shine.addColorStop(0, "rgba(255,255,255,0.75)");
        shine.addColorStop(1, "rgba(255,255,255,0)");
        pen.fillStyle = shine;
        pen.fillRect(-45, -45, 90, 90);
        pen.restore();
      }

      // Skate scratches
      pen.strokeStyle = "rgba(150,175,195,0.35)";
      pen.lineWidth = 1;
      scratches.forEach(line => {
        if (line.some(p => p.z < CAMERA.z + 3)) return;
        pen.beginPath();
        line.forEach((p, i) => {
          const s = toScreen(p.x, 0, p.z);
          if (i === 0) pen.moveTo(s.x, s.y); else pen.lineTo(s.x, s.y);
        });
        pen.stroke();
      });

      // Snow along the boards
      pen.globalAlpha = 0.5;
      pen.lineWidth = 6;
      pen.strokeStyle = "white";
      tracePath(rinkOutline(), 0);
      pen.stroke();
      pen.globalAlpha = 1;

      pen.restore();
    }

    function drawNet() {
      const gz = RINK.goalLine;
      pen.strokeStyle = "rgba(255,255,255,0.75)";
      pen.lineWidth = 1;
      for (let i = 0; i <= 12; i++) {
        const x = -NET.halfWidth + i * 0.5;
        const front = toScreen(x, NET.height, gz);
        const back = toScreen(x * 0.8, 0, gz + NET.depth);
        pen.beginPath(); pen.moveTo(front.x, front.y); pen.lineTo(back.x, back.y); pen.stroke();
      }
      for (let h = 0; h <= NET.height; h += 0.5) {
        const left = toScreen(-NET.halfWidth, h, gz + NET.depth * (1 - h / NET.height));
        const right = toScreen(NET.halfWidth, h, gz + NET.depth * (1 - h / NET.height));
        pen.beginPath(); pen.moveTo(left.x, left.y); pen.lineTo(right.x, right.y); pen.stroke();
      }
      const bl = toScreen(-NET.halfWidth, 0, gz), tl = toScreen(-NET.halfWidth, NET.height, gz);
      const tr = toScreen(NET.halfWidth, NET.height, gz), br = toScreen(NET.halfWidth, 0, gz);
      pen.strokeStyle = COLORS.red;
      pen.lineWidth = Math.max(3, 0.2 * tl.scale);
      pen.lineJoin = "round";
      pen.beginPath();
      pen.moveTo(bl.x, bl.y); pen.lineTo(tl.x, tl.y); pen.lineTo(tr.x, tr.y); pen.lineTo(br.x, br.y);
      pen.stroke();
    }

    // ----- 7. DRAW THE PLAYERS -----
    // Helper: draw a rounded box. We draw players in FEET, then the camera scales them.
    function box(x, y, w, h, color, round) {
      pen.fillStyle = color;
      pen.beginPath();
      pen.roundRect(x, y, w, h, round || 0.1);
      pen.fill();
    }

    // The goalie FACES us (Rangers-style colors)
    function drawGoalie() {
      const p = toScreen(goalie.x, 0, GOALIE_SETTINGS.z);
      pen.save();
      pen.translate(p.x, p.y);
      pen.scale(p.scale, p.scale);           // now 1 unit = 1 foot! (up is negative y)
      pen.rotate(goalie.speed * 0.02);        // lean when moving
      const T = GOALIE_TEAM;

      // stick on the ice
      pen.strokeStyle = "#3a2a1a"; pen.lineWidth = 0.15;
      pen.beginPath(); pen.moveTo(-1.4, -2.6); pen.lineTo(-0.6, -0.1); pen.lineTo(0.5, -0.1); pen.stroke();

      // leg pads (white with red and blue stripes)
      [-1.05, 0.1].forEach(x => {
        box(x, -2.3, 0.95, 2.3, T.pads, 0.2);
        box(x, -1.6, 0.95, 0.15, T.stripe);
        box(x, -1.35, 0.95, 0.15, T.jersey);
        box(x, -0.7, 0.95, 0.15, T.stripe);
      });

      // body (jersey) with stripes
      box(-1.15, -4.3, 2.3, 2.2, T.jersey, 0.35);
      box(-1.15, -2.55, 2.3, 0.18, "white");
      box(-1.15, -2.37, 2.3, 0.18, T.stripe);
      box(-0.9, -3.7, 1.8, 0.3, T.stripe, 0.05);    // stripe across the chest

      // blocker (left of screen) and catching glove (right of screen)
      box(-1.75, -3.4, 0.6, 1.0, "#f4f4f4", 0.12);
      box(-1.75, -3.4, 0.6, 0.12, T.stripe);
      pen.fillStyle = T.jersey;
      pen.beginPath(); pen.ellipse(1.5, -3.2, 0.5, 0.55, 0, 0, Math.PI * 2); pen.fill();
      pen.fillStyle = T.stripe;
      pen.beginPath(); pen.ellipse(1.5, -3.2, 0.25, 0.3, 0, 0, Math.PI * 2); pen.fill();

      // mask with a cage
      pen.fillStyle = "white";
      pen.beginPath(); pen.ellipse(0, -4.75, 0.48, 0.55, 0, 0, Math.PI * 2); pen.fill();
      pen.fillStyle = T.jersey;
      pen.beginPath(); pen.ellipse(0, -4.95, 0.48, 0.3, 0, Math.PI, Math.PI * 2); pen.fill();
      pen.strokeStyle = "#555"; pen.lineWidth = 0.05;
      for (let i = -2; i <= 2; i++) { pen.beginPath(); pen.moveTo(i * 0.12, -4.75); pen.lineTo(i * 0.12, -4.3); pen.stroke(); }
      pen.beginPath(); pen.moveTo(-0.3, -4.55); pen.lineTo(0.3, -4.55); pen.stroke();

      pen.restore();
    }

    // The shooter, seen from BEHIND (Islanders-style colors)
    function drawShooter() {
      const p = toScreen(shooter.x, 0, shooter.z);
      const s = p.scale;
      const T = SHOOTER_TEAM;
      const hand = { x: p.x + 1.15 * s, y: p.y - 3.0 * s };

      // The stick goes from the hands down to the puck (in 3D!)
      const blade = puck.onStick ? toScreen(puck.x - 0.3, 0, puck.z) : toScreen(shooter.x + 1.6, 0, shooter.z + 1.4);
      pen.strokeStyle = "#1a1a1a";
      pen.lineCap = "round";
      pen.lineWidth = 0.14 * s;
      pen.beginPath(); pen.moveTo(hand.x, hand.y); pen.lineTo(blade.x, blade.y); pen.stroke();
      pen.lineWidth = 0.12 * blade.scale;
      pen.beginPath(); pen.moveTo(blade.x, blade.y); pen.lineTo(blade.x + 0.9 * blade.scale, blade.y); pen.stroke();

      pen.save();
      pen.translate(p.x, p.y);
      pen.scale(s, s);
      const stride = (state === "skating" || state === "deke") ? Math.sin(clock * 9) * 0.25 : 0;

      // skates and legs
      box(-0.65, -0.3 + stride, 0.45, 0.3, "#111");
      box(0.2, -0.3 - stride, 0.45, 0.3, "#111");
      box(-0.62, -1.75, 0.4, 1.45 + stride, T.jersey, 0.08);
      box(0.22, -1.75, 0.4, 1.45 - stride, T.jersey, 0.08);
      box(-0.62, -1.3, 0.4, 0.12, T.stripe);
      box(0.22, -1.3, 0.4, 0.12, T.stripe);

      // pants
      box(-0.8, -2.7, 1.6, 1.0, T.pants, 0.2);

      // arms reaching to the stick
      pen.lineCap = "round";
      pen.strokeStyle = T.jersey;
      pen.lineWidth = 0.45;
      pen.beginPath(); pen.moveTo(-0.9, -4.3); pen.lineTo(0.55, -3.25); pen.stroke();
      pen.beginPath(); pen.moveTo(0.95, -4.3); pen.lineTo(1.15, -3.1); pen.stroke();

      // jersey with stripes
      pen.fillStyle = T.jersey;
      pen.beginPath();
      pen.moveTo(-0.95, -2.5); pen.lineTo(0.95, -2.5); pen.lineTo(1.15, -4.5); pen.lineTo(-1.15, -4.5);
      pen.closePath(); pen.fill();
      box(-0.95, -3.0, 1.9, 0.14, T.stripe, 0);
      box(-0.95, -2.86, 1.9, 0.1, "white", 0);

      // gloves
      box(0.35, -3.45, 0.42, 0.4, T.stripe, 0.1);
      box(0.95, -3.3, 0.42, 0.4, T.stripe, 0.1);

      // helmet
      pen.fillStyle = T.jersey;
      pen.beginPath(); pen.ellipse(0, -4.95, 0.42, 0.46, 0, 0, Math.PI * 2); pen.fill();
      pen.restore();

      // jersey number (drawn without scaling so the text looks sharp)
      pen.fillStyle = "white";
      pen.strokeStyle = T.stripe;
      pen.lineWidth = 0.06 * s;
      pen.font = "bold " + Math.round(0.95 * s) + "px Arial";
      pen.textAlign = "center";
      pen.strokeText(T.number, p.x, p.y - 3.35 * s);
      pen.fillText(T.number, p.x, p.y - 3.35 * s);
    }

    function drawPuck() {
      if (puck.z < CAMERA.z + 2) return;
      const ground = toScreen(puck.x, 0, puck.z);
      const p = toScreen(puck.x, puck.y, puck.z);
      const r = Math.max(2, 0.28 * p.scale);
      if (puck.y > 0.15) { // shadow on the ice when the puck is in the air
        pen.fillStyle = "rgba(0,0,0,0.2)";
        pen.beginPath(); pen.ellipse(ground.x, ground.y, r, r * 0.35, 0, 0, Math.PI * 2); pen.fill();
      }
      pen.fillStyle = "#0a0a0a";
      pen.beginPath(); pen.ellipse(p.x, p.y, r, r * 0.45, 0, 0, Math.PI * 2); pen.fill();
    }

    // ----- 8. THE WORDS ON THE SCREEN -----
    function bigText(text, y, size, color) {
      pen.font = "bold " + size + "px Arial";
      pen.textAlign = "center";
      pen.lineWidth = size / 8;
      pen.strokeStyle = "rgba(0,0,0,0.75)";
      pen.strokeText(text, W / 2, y);
      pen.fillStyle = color || "white";
      pen.fillText(text, W / 2, y);
    }

    // The two buttons on the menu
    const buttons = [
      { move: "wrist", x: 190, y: 300, w: 240, h: 90, label: "🏒 Wrist Shot", info: "Fast and accurate" },
      { move: "deke",  x: 470, y: 300, w: 240, h: 90, label: "🔀 Deke",       info: "Fake him out, then shoot!" }
    ];

    function drawScreenWords() {
      // Scoreboard
      box(14, 14, 230, 46, "rgba(0,0,0,0.65)", 10);
      pen.font = "bold 20px Arial"; pen.textAlign = "left"; pen.fillStyle = "white";
      pen.fillText("GOALS " + goals + "   SHOTS " + shots, 28, 44);
      if (state !== "menu") {
        box(W - 214, 14, 200, 46, "rgba(0,0,0,0.65)", 10);
        pen.textAlign = "center"; pen.fillStyle = SHOOTER_TEAM.stripe;
        pen.fillText("Move: " + MOVES[chosenMove].name, W - 114, 44);
      }

      if (state === "menu") {
        box(140, 150, 620, 300, "rgba(5,15,30,0.85)", 20);
        bigText("SHOOTOUT!", 215, 52, SHOOTER_TEAM.stripe);
        bigText("Choose your move before the whistle", 265, 22);
        buttons.forEach(b => {
          const picked = b.move === chosenMove;
          box(b.x, b.y, b.w, b.h, picked ? SHOOTER_TEAM.stripe : SHOOTER_TEAM.jersey, 14);
          pen.textAlign = "center"; pen.fillStyle = "white";
          pen.font = "bold 26px Arial"; pen.fillText(b.label, b.x + b.w / 2, b.y + 40);
          pen.font = "16px Arial"; pen.fillText(b.info, b.x + b.w / 2, b.y + 68);
        });
        pen.font = "16px Arial"; pen.fillStyle = "#cfe3f5";
        pen.fillText("Arrow keys to skate  •  Click inside the net to shoot", W / 2, 425);
      }
      if (state === "ready") bigText("Get ready...", 300, 48);
      if (state === "skating" && timer < 0.8) bigText("TWEEEET! GO!", 300, 56, "#ffe14d");
      if (state === "result") {
        bigText(resultText, 260, 64, resultText.startsWith("GOAL") ? "#ffe14d" : "white");
        bigText("Click to go again", 330, 26);
      }
      if (messageTimer > 0) bigText(message, H - 30, 22, "#ffe14d");
    }

    // ----- 9. CLICKING -----
    canvas.addEventListener("click", e => {
      startAudio();
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (W / rect.width);   // turn the click into canvas pixels
      const my = (e.clientY - rect.top) * (H / rect.height);

      if (state === "menu") {
        buttons.forEach(b => {
          if (mx > b.x && mx < b.x + b.w && my > b.y && my < b.y + b.h) {
            chosenMove = b.move;
            startShootout();
          }
        });
      } else if (state === "skating") {
        const target = screenToNet(mx, my);
        const insideNet = Math.abs(target.x) < NET.halfWidth + 0.2 && target.y > 0 && target.y < NET.height + 0.2;
        if (!insideNet) { message = "Click INSIDE the net to shoot!"; messageTimer = 1.5; return; }
        if (chosenMove === "deke") startDeke(target); else shoot(target);
      } else if (state === "result") {
        state = "menu";
      }
    });

    // ----- 10. GAME ACTIONS -----
    function startShootout() {
      shooter.x = 0; shooter.z = 22; shooter.speed = SKATE.startSpeed;
      goalie.x = 0; goalie.speed = 0;
      puck.onStick = true; puck.y = 0;
      shot = null; deke = null;
      state = "ready"; timer = 0;
    }

    function startDeke(target) {
      // Fake to the OTHER side of where you want to shoot
      const direction = target.x >= goalie.x ? -1 : 1;
      deke = { target: target, direction: direction, time: 0.35 };
      state = "deke"; timer = 0;
    }

    function shoot(target) {
      shots++;
      puck.onStick = false;
      const distance = Math.hypot(target.x - puck.x, RINK.goalLine - puck.z);
      shot = {
        fromX: puck.x, fromZ: puck.z, toX: target.x, toY: target.y,
        time: 0, flightTime: distance / MOVES[chosenMove].puckSpeed, done: false, bounce: null
      };
      state = "shot"; timer = 0;
    }

    // When the puck reaches the net: goal, save, or post?
    function checkShot() {
      const dx = shot.toX - goalie.x;   // how far the puck is from the goalie's middle
      const y = shot.toY;
      if (Math.abs(shot.toX) > NET.halfWidth - 0.15 || y > NET.height - 0.15) {
        if (Math.abs(shot.toX) > NET.halfWidth || y > NET.height) return "Wide! Missed the net";
        return "PING! Off the post!";
      }
      if (y > 2.4 && dx > 0.6 && dx < 2.1) return "GLOVE SAVE!";
      if (y > 1.6 && dx < -0.6 && dx > -2.0) return "BLOCKER SAVE!";
      if (y < 1.2 && Math.abs(dx) < 1.6) return "PAD SAVE!";
      if (Math.abs(dx) < 1.2) return "SAVE!";
      return "GOAL!";
    }

    // ----- 11. UPDATE: move everything a tiny bit, many times per second -----
    function update(dt) {
      clock += dt;
      timer += dt;
      messageTimer -= dt;

      if (state === "ready" && timer > 1.2) {
        playWhistle();
        state = "skating"; timer = 0;
      }

      if (state === "skating" || state === "deke") {
        // Speed up / slow down with the arrow keys
        if (keys["ArrowUp"]) shooter.speed = Math.min(SKATE.maxSpeed, shooter.speed + 12 * dt);
        if (keys["ArrowDown"]) shooter.speed = Math.max(SKATE.minSpeed, shooter.speed - 12 * dt);
        shooter.z += shooter.speed * dt;

        if (state === "deke") {
          shooter.x += deke.direction * 18 * dt;   // quick fake to one side!
          deke.time -= dt;
          if (deke.time <= 0) shoot(deke.target);
        } else {
          if (keys["ArrowLeft"]) shooter.x -= SKATE.sideSpeed * dt;
          if (keys["ArrowRight"]) shooter.x += SKATE.sideSpeed * dt;
        }
        shooter.x = Math.max(-30, Math.min(30, shooter.x));

        // Skated in too close without shooting? The goalie poke-checks you!
        if (shooter.z > 74 && state === "skating") {
          shots++;
          puck.onStick = false;
          resultText = "POKE CHECK! Shoot sooner!";
          playThud(false);
          state = "result"; timer = 0;
        }
      }

      // The puck rides on the stick until you shoot
      if (puck.onStick) {
        puck.x = shooter.x + 1.9;
        puck.z = shooter.z + 1.4;
        puck.y = 0;
      }

      // The puck flies toward the net
      if (state === "shot") {
        shot.time += dt;
        if (!shot.done) {
          const t = Math.min(1, shot.time / shot.flightTime);
          puck.x = shot.fromX + (shot.toX - shot.fromX) * t;
          puck.z = shot.fromZ + (RINK.goalLine - shot.fromZ) * t;
          puck.y = shot.toY * t;
          if (t >= 1) {
            shot.done = true;
            resultText = checkShot();
            if (resultText === "GOAL!") { goals++; playHorn(); shot.bounce = { vx: 0, vz: 6 }; }
            else if (resultText.startsWith("PING")) { playThud(true); shot.bounce = { vx: puck.x > 0 ? 12 : -12, vz: -18 }; }
            else { playThud(false); shot.bounce = { vx: (Math.random() - 0.5) * 20, vz: -15 }; }
            shot.timeAfter = 0;
          }
        } else {
          // After the shot: into the net, or bouncing away
          shot.timeAfter += dt;
          if (resultText === "GOAL!") {
            puck.z = Math.min(RINK.goalLine + NET.depth - 0.5, puck.z + shot.bounce.vz * dt);
            puck.y = Math.max(0, puck.y - 4 * dt);
          } else {
            puck.x += shot.bounce.vx * dt;
            puck.z += shot.bounce.vz * dt;
            puck.y = Math.max(0, puck.y - 6 * dt);
          }
          if (shot.timeAfter > 0.8) { state = "result"; timer = 0; }
        }
      }

      // The goalie moves to stop the puck
      let goalieWants = Math.max(-2.2, Math.min(2.2, puck.x * 0.3)); // usually: stay square to the puck
      let goalieSpeed = GOALIE_SETTINGS.speed;
      if (state === "deke") {           // the goalie BITES on the fake!
        goalieWants = Math.max(-2.6, Math.min(2.6, goalie.x + deke.direction * 3));
        goalieSpeed = 12;
      }
      if (state === "shot" && !shot.done) {
        if (shot.time > GOALIE_SETTINGS.reactionTime) goalieWants = Math.max(-2.4, Math.min(2.4, shot.toX));
        else goalieWants = goalie.x; // still reacting...
      }
      if (state === "shot" && shot.done) goalieWants = goalie.x;
      const move = Math.max(-goalieSpeed * dt, Math.min(goalieSpeed * dt, goalieWants - goalie.x));
      goalie.x += move;
      goalie.speed = move / dt;

      // The camera follows the shooter
      const followZ = Math.min(shooter.z, 74);
      CAMERA.z = followZ - CAMERA.behind;
      CAMERA.x += (shooter.x + CAMERA.side - CAMERA.x) * Math.min(1, 5 * dt);
    }

    // ----- 12. DRAW EVERYTHING (far things first, close things last!) -----
    function draw() {
      drawCrowd();
      drawBoards();
      drawIce();

      // Sort the net, goalie, puck and shooter from FAR to CLOSE
      const things = [
        { z: RINK.goalLine + 0.5, draw: drawNet },
        { z: GOALIE_SETTINGS.z, draw: drawGoalie },
        { z: puck.z, draw: drawPuck },
        { z: shooter.z, draw: drawShooter }
      ];
      things.sort((a, b) => b.z - a.z);
      things.forEach(t => t.draw());

      drawScreenWords();
    }

    // ----- 13. THE GAME LOOP: update, draw, repeat about 60 times every second! -----
    let lastTime = performance.now();
    function gameLoop(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000); // seconds since the last frame
      lastTime = now;
      update(dt);
      draw();
      requestAnimationFrame(gameLoop);
    }
    CAMERA.z = shooter.z - CAMERA.behind;
    CAMERA.x = shooter.x + CAMERA.side;
    requestAnimationFrame(gameLoop);
  </script>

</body>
</html>
