<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sarosh's Hockey Shootout</title>
  <style>
    /* This part (CSS) decides how the words and buttons LOOK */
    html, body { margin: 0; height: 100%; overflow: hidden; background: #06090e;
                 font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
    canvas { display: block; }
    #hud { position: fixed; inset: 0; pointer-events: none; color: white; }
    .panel { background: rgba(5, 12, 24, 0.72); border-radius: 14px; padding: 10px 18px;
             font-weight: 800; letter-spacing: 0.5px; box-shadow: 0 6px 24px rgba(0,0,0,0.4); }
    #score { position: absolute; top: 16px; left: 16px; font-size: 20px; }
    #moveTag { position: absolute; top: 16px; right: 16px; font-size: 20px; color: #f47d30; display: none; }
    #big { position: absolute; top: 28%; width: 100%; text-align: center; font-size: 76px; font-weight: 900;
           text-shadow: 0 4px 18px rgba(0,0,0,0.85); }
    #sub { position: absolute; top: calc(28% + 100px); width: 100%; text-align: center; font-size: 26px;
           font-weight: 700; text-shadow: 0 2px 10px black; }
    #hint { position: absolute; bottom: 24px; width: 100%; text-align: center; font-size: 22px; font-weight: 800;
            color: #ffe14d; text-shadow: 0 2px 10px black; }
    #menu { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: auto;
            text-align: center; padding: 28px 40px; }
    #menu h1 { margin: 0; font-size: 64px; color: #f47d30; font-weight: 900; font-style: italic; letter-spacing: 2px; }
    #menu p { margin: 8px 0 20px; font-size: 20px; }
    #menu .help { font-size: 16px; color: #cfe3f5; font-weight: 600; margin: 20px 0 0; }
    .buttons { display: flex; gap: 20px; justify-content: center; }
    button { font: inherit; font-size: 26px; font-weight: 800; color: white; background: #00539b; border: none;
             border-radius: 14px; padding: 16px 26px; cursor: pointer; min-width: 220px;
             box-shadow: 0 4px 0 #003366; }
    button:hover { background: #f47d30; box-shadow: 0 4px 0 #b3541a; }
    button small { display: block; font-size: 15px; font-weight: 600; margin-top: 4px; }
  </style>
</head>
<body>
  <!-- The words on top of the game (scoreboard, menu, messages) -->
  <div id="hud">
    <div id="score" class="panel">GOALS 0 · SHOTS 0</div>
    <div id="moveTag" class="panel"></div>
    <div id="big"></div>
    <div id="sub"></div>
    <div id="hint"></div>
    <div id="menu" class="panel">
      <h1>SHOOTOUT!</h1>
      <p>Choose your move before the whistle</p>
      <div class="buttons">
        <button data-move="wrist">🏒 Wrist Shot<small>Fast and accurate</small></button>
        <button data-move="deke">🔀 Deke<small>Fake him out, then shoot!</small></button>
      </div>
      <p class="help">⬅️ ➡️ steer · ⬆️ faster · ⬇️ slower · Click inside the net to shoot</p>
    </div>
  </div>

  <!-- three.js: the 3D engine (lights, shadows, 3D shapes) -->
  <script src="lib/three.min.js"></script>
  <!-- Our game code! -->
  <script src="game.js"></script>
</body>
</html>
