<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sarosh's Hockey Shootout</title>
  <style>
    /* This part (CSS) decides how the words and buttons LOOK */
    html, body { margin: 0; height: 100%; overflow: hidden; background: #06090e;
                 font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
    canvas { display: block; }
    #vignette { position: fixed; inset: 0; pointer-events: none;
                background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.5) 100%); }
    #hud { position: fixed; inset: 0; pointer-events: none; color: white; }
    .panel { background: rgba(5, 12, 24, 0.78); border-radius: 14px; padding: 10px 18px;
             font-weight: 800; letter-spacing: 0.5px; box-shadow: 0 6px 24px rgba(0,0,0,0.45); }

    /* The shootout tracker (top left) */
    #tracker { position: absolute; top: 16px; left: 16px; font-size: 17px; padding: 10px 16px; }
    #tracker .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
    #tracker .team { width: 64px; }
    #tracker .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #8aa0b8; box-sizing: border-box; }
    #tracker .goal { background: #2ecc71; border-color: #2ecc71; }
    #tracker .miss { background: #e74c3c; border-color: #e74c3c; }
    #tracker .label { font-size: 13px; color: #f47d30; margin-bottom: 4px; letter-spacing: 2px; }

    #moveTag { position: absolute; top: 16px; right: 16px; font-size: 20px; color: #f47d30; display: none; }
    #big { position: absolute; top: 24%; width: 100%; text-align: center; font-size: 78px; font-weight: 900;
           text-shadow: 0 4px 18px rgba(0,0,0,0.85); }
    #sub { position: absolute; top: calc(24% + 104px); width: 100%; text-align: center; font-size: 25px;
           font-weight: 700; text-shadow: 0 2px 10px black; line-height: 1.5; }
    #hint { position: absolute; bottom: 24px; width: 100%; text-align: center; font-size: 22px; font-weight: 800;
            color: #ffe14d; text-shadow: 0 2px 10px black; }

    /* The menu where you pick your move */
    #menu { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: auto;
            text-align: center; padding: 22px 28px; width: min(900px, 92vw); box-sizing: border-box; }
    #menu h1 { margin: 0; font-size: 56px; color: #f47d30; font-weight: 900; font-style: italic; letter-spacing: 2px; }
    #menu p { margin: 4px 0 16px; font-size: 19px; }
    #menu .help { font-size: 15px; color: #cfe3f5; font-weight: 600; margin: 16px 0 0; }
    .buttons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    button { font: inherit; font-size: 17px; font-weight: 800; color: white; background: #00539b; border: none;
             border-radius: 12px; padding: 12px 6px; cursor: pointer; box-shadow: 0 4px 0 #003366; }
    button:hover { background: #f47d30; box-shadow: 0 4px 0 #b3541a; }
    .modes { display: flex; gap: 10px; justify-content: center; margin-bottom: 14px; }
    .modes button { font-size: 18px; padding: 10px 18px; background: #26364d; box-shadow: 0 4px 0 #111b28; }
    .modes button.picked, #viewButtons button.picked { background: #f47d30; box-shadow: 0 4px 0 #b3541a; }
    button .icon { display: block; font-size: 28px; }
    button small { display: block; font-size: 12px; font-weight: 600; margin-top: 4px; opacity: 0.9; }
  </style>
</head>
<body>
  <!-- Darker edges around the picture, like a TV camera -->
  <div id="vignette"></div>
  <!-- The words on top of the game (tracker, menu, messages) -->
  <div id="hud">
    <div id="tracker" class="panel"></div>
    <div id="moveTag" class="panel"></div>
    <div id="big"></div>
    <div id="sub"></div>
    <div id="hint"></div>
    <div id="menu" class="panel">
      <h1>SHOOTOUT!</h1>
      <p id="roundText">Round 1 — choose your move before the whistle</p>
      <div class="modes" id="modeButtons"></div>
      <div class="modes" id="viewButtons"></div>
      <div class="buttons" id="moveButtons"></div>
      <p class="help">⬅️ ➡️ steer · ⬆️ faster · ⬇️ slower · Skate &amp; Shoot: click the net · Pause to Shoot: click, aim, press SPACE<br>In goal: mouse = glove · hold SPACE = butterfly</p>
    </div>
  </div>

  <!-- three.js: the 3D engine (lights, shadows, 3D shapes) -->
  <script src="lib/three.min.js"></script>
  <!-- three.js extras: model loader, ice reflections, glowing lights -->
  <script src="lib/three-extras.min.js"></script>
  <!-- The real 3D player (made from the Mixamo files) -->
  <script src="models/player.js"></script>
  <!-- Our game code! -->
  <script src="game.js"></script>
</body>
</html>
